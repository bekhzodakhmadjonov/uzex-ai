services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - UZEX_DB=/srv/data/uzex.duckdb
    volumes:
      - ./data:/srv/data
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  caddy_data:
  caddy_config:
