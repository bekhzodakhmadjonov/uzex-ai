<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UZEX Talab · talab birjasi</title>
<meta name="description" content="Talab birjasi: nima kerakligini yozing, ayting yoki smeta rasmini yuklang. AI tushunadi, kod kafolatlaydi, siz imzolaysiz.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23283f78'/%3E%3Cpath d='M8 9h16v3.5H8zM14.25 12.5h3.5V24h-3.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#f4f6f9; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#141b2d; --ink-2:#4e5869; --ink-3:#7c8597;
  --line:#e1e5ec; --line-2:#eef1f5;
  --navy:#283f78; --navy-d:#1e3061; --navy-tint:#eaeef7; --navy-2:#6f85bf;
  --teal:#0a7a6d; --teal-tint:#dff1ee;
  --gold:#8f6412; --gold-tint:#fbf2dc; --gold-mark:#d9a441;
  --red:#b3261e; --red-tint:#f9e4e2;
  --plum-tint:#efeaf7; --rose-tint:#fbe9e7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --sh:0 1px 2px rgba(20,27,45,.05),0 2px 8px rgba(20,27,45,.05); --sh2:0 8px 28px rgba(20,27,45,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);min-height:100vh}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)} .muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
h1,h2,h3{margin:0}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* modes */
body[data-mode=oddiy] .biz,body[data-mode=oddiy] .pro{display:none!important}
body[data-mode=biznes] .pro{display:none!important}
body:not([data-mode=oddiy]) .odd{display:none!important}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.hdr .r1{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo img{height:30px;display:block}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font:700 17px/1 var(--sans);letter-spacing:.16em;color:var(--navy)}
.logo .wm span{font:400 11.5px/1 var(--sans);color:var(--ink-3);margin-top:4px}
.logo .dv{width:1px;height:30px;background:var(--line)}
.search{flex:1;display:flex;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:3px 4px 3px 12px;min-width:0}
.search svg.ai{color:var(--gold);width:20px;height:20px}
.search input{flex:1;border:0;outline:0;background:transparent;padding:9px 6px;font-size:15.5px;min-width:0}
.search .ib{border:0;background:transparent;width:38px;height:38px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.search .ib:hover{background:var(--navy-tint);color:var(--navy)}
.search .ib.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(179,38,30,.15)}}
.search .go{border:0;background:var(--navy);color:#fff;border-radius:9px;padding:9px 18px;font-weight:600}
.search .go:hover{background:var(--navy-d)}
.hico{display:flex;gap:4px;flex:none}
.hico a,.hico button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;font-size:12px;color:var(--ink-2);position:relative}
.hico a:hover,.hico button:hover{background:var(--surface-2);color:var(--navy)}
.hico .badge{position:absolute;top:2px;right:8px;background:var(--red);color:#fff;font:600 11px/1 var(--sans);padding:3px 5px;border-radius:9px;min-width:18px;text-align:center}
.hdr .r2{display:flex;align-items:center;gap:6px;min-height:44px;overflow-x:auto;scrollbar-width:none}
.hdr .r2::-webkit-scrollbar{display:none}
.cat{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.cat:hover{background:var(--surface-2);color:var(--ink)}
.cat.on{background:var(--navy-tint);color:var(--navy);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;border-radius:7px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--navy);font-weight:600;box-shadow:var(--sh)}
.aichip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.aichip i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.aichip.live i{background:#16a34a} .aichip.fake i{background:var(--gold-mark)}
@media (max-width:860px){
  .hdr .r1{flex-wrap:wrap;gap:10px;padding:8px 0}
  .search{order:3;flex-basis:100%}
  .logo .wm span,.hico span{display:none}
  .hico{margin-left:auto}
  .hdr .r2{flex-wrap:wrap;overflow:visible;padding-bottom:6px;gap:6px}
  #cats{width:100%;overflow-x:auto;scrollbar-width:none}
  #cats::-webkit-scrollbar{display:none}
  .hdr .r2 .sp{display:none}
}

/* ---------- common ---------- */
main.wrap{padding-top:20px;padding-bottom:90px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.btn{border:0;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--navy-d)}
.btn.lg{padding:14px 22px;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.ghost:hover{background:var(--navy-tint)}
.btn.soft{background:var(--navy-tint);color:var(--navy)}
.btn.soft:hover{background:#dde4f3}
.btn.teal{background:var(--teal)} .btn.teal:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.stamp{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--sans);padding:5px 8px;border-radius:6px;white-space:nowrap}
.stamp.ai{color:var(--gold);background:var(--gold-tint)}
.stamp.code{color:var(--teal);background:var(--teal-tint)}
.stamp.human{color:var(--navy);background:var(--navy-tint)}
.stamp.no{color:var(--red);background:var(--red-tint)}
.stamp.plain{color:var(--ink-2);background:var(--surface-2)}
.stamp svg.i{width:13px;height:13px;stroke-width:2.2}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumbs a:hover{color:var(--navy)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec-h h2{font:700 21px/1.2 var(--sans)}
.sec-h a{font-size:14px;color:var(--navy)}
input.f,select.f{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);width:100%;min-width:0}
input.f:focus,select.f:focus{outline:2px solid var(--navy-2);border-color:transparent}
label.l{display:block;font-size:12.5px;color:var(--ink-3);margin:0 0 4px}
.loading{color:var(--ink-3);padding:30px 0;text-align:center}
.err{color:var(--red)}
.note{font-size:12.5px;color:var(--ink-3)}
.why{font-size:12.5px;color:var(--ink-3)}
.term{border:0;background:none;padding:0;color:inherit;border-bottom:1px dashed var(--navy-2);cursor:help;font:inherit}
.pop{position:absolute;z-index:80;max-width:320px;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:var(--sh2)}

/* ---------- home ---------- */
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:28px 28px 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero h1{font:700 30px/1.15 var(--sans);letter-spacing:-.01em}
.hero p{color:#cfd7ee;margin:10px 0 18px;font-size:15.5px;max-width:560px}
.hero .ways{display:flex;gap:8px;flex-wrap:wrap}
.hero .way{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px}
.hero .way:hover{background:rgba(255,255,255,.18)}
.hero .trustg{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px 16px}
.hero .trustg>b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aebbe0;margin-bottom:6px}
.tg{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.tg i{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tg i svg{width:15px;height:15px;stroke-width:2.2}
.tg .a{background:var(--gold-tint);color:var(--gold)} .tg .c{background:var(--teal-tint);color:var(--teal)} .tg .h{background:var(--navy-tint);color:var(--navy)}
.hero .tg strong{color:#fff} .hero .tg span{color:#cfd7ee}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:22px}.hero h1{font-size:24px}}
.intents{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.intent{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;text-align:left;border:0;display:flex;gap:12px;align-items:flex-start;transition:transform .12s,box-shadow .12s}
.intent:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.intent .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.intent b{display:block;font-size:15.5px}
.intent span span{font-size:13px;color:var(--ink-3)}
@media (max-width:860px){.intents{grid-template-columns:1fr 1fr}}
.how{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);margin-top:14px;overflow:hidden}
.how div{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.how div+div{border-left:1px solid var(--line-2)}
.how b{display:block;color:var(--ink);font-size:14px}
.how .n{font:600 12px var(--mono);width:24px;height:24px;border-radius:50%;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:860px){.how{grid-template-columns:1fr 1fr}.how div:nth-child(3){border-left:0}.how div:nth-child(n+3){border-top:1px solid var(--line-2)}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.pc{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.pc:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.pc .pic{height:118px;display:flex;align-items:center;justify-content:center;position:relative}
.pc .pic svg.i{width:56px;height:56px;stroke-width:1.4}
.pc .pic .sig{position:absolute;bottom:10px;left:10px}
.pc .pic .chg{position:absolute;top:10px;right:10px;font:600 12px var(--mono);background:var(--surface);padding:3px 7px;border-radius:6px}
.pc .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .nm{font-weight:600;font-size:15.5px}
.pc .pr{font-size:12.5px;color:var(--ink-3)}
.pc .pr b{display:block;font:700 18px/1.25 var(--sans);color:var(--ink)}
.pc .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;flex:1}
.pc .add{margin-top:10px;padding:9px 12px}
.up{color:var(--red)} .dn{color:var(--teal)}
.t-qurilish{background:var(--navy-tint);color:var(--navy)} .t-oziq{background:var(--gold-tint);color:var(--gold)} .t-yoqilgi{background:var(--rose-tint);color:var(--red)} .t-qishloq{background:var(--teal-tint);color:var(--teal)} .t-kimyo{background:var(--plum-tint);color:#5b3f99}
.ic.sq{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:960px){.pp{grid-template-columns:minmax(0,1fr)}}
.pp .head{display:flex;gap:16px;align-items:center}
.pp .head .pic{width:76px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.pp .head .pic svg.i{width:40px;height:40px;stroke-width:1.5}
.pp .head h1{font:700 26px/1.2 var(--sans)}
.buybox{position:sticky;top:130px}
.buybox .big{font:700 26px/1.1 var(--sans)}
.buybox .fld{margin-top:10px}
.buybox .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.band{position:relative;height:56px;margin:30px 8px 8px}
.band .rail{position:absolute;top:22px;left:0;right:0;height:12px;background:var(--line-2);border-radius:6px}
.band .mid{position:absolute;top:22px;height:12px;background:var(--navy-2);border-radius:6px}
.band .tick{position:absolute;top:40px;font:500 11.5px var(--mono);color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.band .you{position:absolute;top:10px;width:3px;height:36px;background:var(--ink);border-radius:2px}
.band .you span{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);font:600 12px var(--sans);white-space:nowrap;background:var(--ink);color:#fff;padding:3px 7px;border-radius:6px}
.sigbox{border-radius:12px;padding:14px 16px;background:var(--navy-tint)}
.sigbox.buy{background:var(--teal-tint)} .sigbox.wait{background:var(--gold-tint)}
.sigbox b{display:block;font-size:17px;margin-bottom:2px}
.chartbox{position:relative;height:230px}
.chartbox.sm{height:150px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.g2{grid-template-columns:minmax(0,1fr)!important}}
.nega{border:0;background:var(--gold-tint);color:var(--gold);border-radius:7px;font:600 12px var(--sans);padding:5px 9px;display:inline-flex;align-items:center;gap:5px}
.nega svg.i{width:13px;height:13px}
.expl{margin-top:10px;background:var(--gold-tint);border-radius:10px;padding:10px 12px;font-size:14px}
.expl .src{font-size:11.5px;color:var(--gold);margin-top:6px}
.lots{width:100%;border-collapse:collapse;font-size:14px}
.lots th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
.lots th.n,.lots td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.lots td{padding:10px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.trust{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.trust .bar{width:56px;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.trust .bar i{display:block;height:100%;background:var(--teal)}
.trust.low .bar i{background:var(--red)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px;align-items:center}
.list li:last-child{border-bottom:0}

/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,27,45,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.ov.on{display:flex}
.sheet{background:var(--paper);border-radius:16px;max-width:860px;width:100%;box-shadow:var(--sh2);overflow:hidden}
.sheet .top{background:var(--surface);padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet .top h2{font:700 19px/1.2 var(--sans)}
.sheet .top>svg.i{color:var(--gold)}
.sheet .x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.sheet .bd{padding:16px 20px 20px}
.thinking{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--ink-2)}
.dots{display:inline-flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--gold-mark);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.5}}
.heard{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;gap:12px;align-items:flex-start}
.heard img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.chk{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.chk li{display:flex;gap:8px;padding:3px 0}
.chk li i{font-style:normal;font-weight:700;width:16px;text-align:center}
.chk .ok i{color:var(--teal)} .chk .warn i{color:var(--gold)} .chk .fail i{color:var(--red)}
.tn{background:var(--surface);border-radius:12px;padding:14px 16px;margin-top:10px;box-shadow:var(--sh)}
.tn .h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tn .h b{font-size:16px}
.tn .ff{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.tn .ff{grid-template-columns:1fr 1fr}}
.qs{background:var(--gold-tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.convo{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.msg .av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.msg .av svg.i{width:16px;height:16px}
.msg .tx{background:var(--surface);border-radius:12px;padding:10px 13px;font-size:14.5px;box-shadow:var(--sh)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .tx{background:var(--navy);color:#fff;box-shadow:none}
.msg.me .av{background:var(--navy-tint);color:var(--navy)}
.msg.ag .av{background:var(--gold-tint);color:var(--gold)}
.fcard{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--sh);margin-left:40px;border-left:4px solid var(--teal)}
.fcard .big{font:700 20px/1.2 var(--sans)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:40px}
.chip2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--navy);text-align:left}
.chip2:hover{border-color:var(--navy);background:var(--navy-tint)}
.reply{display:flex;gap:6px;align-items:center;background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:3px 4px 3px 12px;margin-top:14px}
.reply input{flex:1;border:0;outline:0;padding:9px 4px;font-size:15px;background:transparent;min-width:0}
.reply button{border:0;border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink-2)}
.reply button.send{background:var(--navy);color:#fff;width:auto;padding:0 14px;font-weight:600}

/* cart */
.cartg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:960px){.cartg{grid-template-columns:minmax(0,1fr)}}
.sum{position:sticky;top:130px}

details summary{cursor:pointer;color:var(--navy);font-size:13.5px;margin-top:8px}
.checks{list-style:none;margin:6px 0 0;padding:0;font-size:13px}

/* checkout + orders */
table.cost{width:100%;border-collapse:collapse;font-size:14.5px}
table.cost td{padding:9px 0;border-bottom:1px solid var(--line-2);vertical-align:top}

.okm{color:var(--teal);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.order{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:12px}

}
.foot{margin-top:40px;padding:18px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* evidence */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 12px}
.kpi{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}

.kpi span{font-size:13px;color:var(--ink-2)}

/* ===================== v3: professional marketplace theme ===================== */
:root{
  --paper:#f3f4f6; --surface:#fff; --surface-2:#f7f8fa;
  --ink:#0d1526; --ink-2:#4a5468; --ink-3:#7a8396;
  --line:#e3e6eb; --line-2:#eef0f3;
  --navy:#1f3b78; --navy-d:#172d5e; --navy-tint:#edf1f9; --navy-2:#6a82bd;
  --teal:#0b7a5c; --teal-tint:#e5f4ee; --red:#c0362c; --red-tint:#fbeceb;
  --r:10px; --sh:none; --sh2:0 10px 30px rgba(13,21,38,.12);
}
body{background:var(--paper);font-size:15px}
.wrap{max-width:1680px;padding:0 32px}

main.wrap{padding-top:24px}
.card,.pc,.tn,.offer,.order,.intent,.how,.kpi{box-shadow:none;border:1px solid var(--line)}
.btn{border-radius:8px}
.btn.soft{background:var(--surface);color:var(--navy);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft:hover{box-shadow:inset 0 0 0 1px var(--navy);background:var(--surface)}
.stamp{border-radius:4px;font-weight:600;letter-spacing:.01em}
.stamp.ai{color:var(--ink-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.stamp svg.i{display:none}
.term{border-bottom-color:var(--line)}

/* header */
.hdr{box-shadow:none;border-bottom:1px solid var(--line)}
.hdr .r1{min-height:72px;gap:28px}
.brand2{display:flex;align-items:center;gap:14px;flex:none;color:var(--ink)}
.brand2 img{height:32px;display:block}

.brand2 b{font:600 20px/1 var(--sans);letter-spacing:-.01em;color:var(--navy)}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px 4px 4px 14px;max-width:880px}
.search:focus-within{border-color:var(--navy);background:var(--surface);box-shadow:0 0 0 3px rgba(31,59,120,.12)}
.search svg.lead{width:18px;height:18px;color:var(--ink-3)}
.search .go{border-radius:8px;padding:10px 20px}
.hico a,.hico button{flex-direction:row;gap:8px;font-size:14px;color:var(--ink);padding:9px 12px;border-radius:8px}
.hico .badge{position:static;margin-left:-2px;background:var(--navy);font-size:11px;padding:3px 6px}
.hdr .r2{min-height:46px;border-top:1px solid var(--line-2)}
.cat{font-size:14px;padding:12px 2px;margin-right:22px;border-radius:0;color:var(--ink-2);border-bottom:2px solid transparent}
.cat:hover{background:none;color:var(--ink)}
.cat.on{background:none;color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.util{display:flex;align-items:center;gap:18px;font-size:13.5px;color:var(--ink-2)}
.util a,.util button{border:0;background:none;color:var(--ink-2);padding:0;font-size:13.5px}
.util a:hover,.util button:hover{color:var(--navy)}
.seg{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border-radius:6px;padding:4px 10px}
.seg button.on{box-shadow:none;background:var(--surface);color:var(--navy);outline:1px solid var(--line)}
.aichip{display:none}

/* ticker */
.ticker{background:var(--ink);color:#d7dce6;font:500 12.5px/1 var(--mono);overflow:hidden;white-space:nowrap}
.ticker .in{display:inline-flex;gap:34px;padding:10px 0;animation:tk 60s linear infinite}
.ticker:hover .in{animation-play-state:paused}

.ticker a b{color:#fff;font-weight:500;font-family:var(--sans)}
.ticker .u{color:#ff8a80}.tick .d{color:#6ee7b7}
@keyframes tk{to{transform:translateX(-50%)}}

/* home */
.hero3{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:340px}

@media (max-width:960px){.hero3{grid-template-columns:1fr}.hero3 .ph{min-height:220px;order:-1}.hero3 .tx{padding:26px 22px}.hero3 h1{font-size:28px}}
.cats3{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:18px}
.cat3{position:relative;border-radius:12px;overflow:hidden;height:132px;background:#ccc center/cover;display:flex;align-items:flex-end;padding:14px;color:#fff}

.sec-h{margin:34px 0 14px}

/* product card */
.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pc{border-radius:12px;transition:border-color .12s,box-shadow .12s}
.pc:hover{transform:none;box-shadow:var(--sh2);border-color:transparent}

/* product page */
.pp .head .ph{width:132px;height:100px;border-radius:10px;background:#e9ecf1 center/cover;flex:none}
.pp .head h1{font-size:30px;letter-spacing:-.01em}
.band .mid{background:var(--navy)}
.nega{background:var(--surface-2);color:var(--navy);box-shadow:inset 0 0 0 1px var(--line)}
.nega svg.i{display:none}
.expl{background:var(--surface-2);border:1px solid var(--line)}
.expl .src{color:var(--ink-3)}
.sigbox{border:1px solid var(--line)}

/* sheets, chat */

.dots i{background:var(--navy-2)}
.draft{background:var(--surface-2);border:1px solid var(--line)}
.feed li .ic.a{background:var(--navy-tint);color:var(--navy)}
.tg .a{background:var(--navy-tint);color:var(--navy)}
.foot{justify-content:space-between}
.fab{box-shadow:0 2px 10px rgba(13,21,38,.12);border:1px solid var(--line)}

/* ===================== modes + group buy ===================== */
.modehint{font-size:12.5px;color:var(--ink-3);margin:-8px 0 14px}
.thermo{margin:22px 4px 6px}
.thermo .bar{display:flex;height:44px;border-radius:10px;overflow:hidden;font-weight:600;font-size:14px}

.big1{font:700 30px/1.15 var(--sans);letter-spacing:-.01em}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}

table.dense{width:100%;border-collapse:collapse;font:12.5px/1.35 var(--mono)}

.pc .pool{font-size:12px;color:var(--teal);font-weight:600}

    if(r.mode==="chat")S.thread.push({role:"a",type:"chat",text:md(r.reply),facts,suggestions:r.suggestions,model:r.model,fresh:true});

let REC=null;
async function startRec(){if(REC)return;openAI();
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaStreamSource(stream);const proc=ctx.createScriptProcessor(4096,1,1);const chunks=[];

    proc.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));let s2=0;for(let i=0;i<d.length;i+=16)s2+=d[i]*d[i];const v=Math.min(1,Math.sqrt(s2/(d.length/16))*6);REC&&REC.lv.push(v)};
    src.connect(proc);proc.connect(ctx.destination);renderFoot();setState("Tinglayapman…");
    REC.iv=setInterval(()=>{if(!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000);const t=$("#recT");if(t)t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;const bars=$$("#recL i"),lv=REC.lv.slice(-bars.length);bars.forEach((b,i)=>b.style.height=Math.max(3,(lv[i]||0)*26)+"px");if(s>=30)stopRec(true)},90)}
  catch(e){say("Mikrofonga ruxsat berilmadi. Brauzer sozlamalarida mikrofonni yoqing yoki yozib yuboring.")}}

  if(!send)return;
  const len=R.chunks.reduce((a,c)=>a+c.length,0),all=new Float32Array(len);let o=0;R.chunks.forEach(c=>{all.set(c,o);o+=c.length});
  const ratio=sr/16000,n=Math.floor(len/ratio);if(n<16000*0.6){say("Yozuv juda qisqa bo'ldi — yana bir bor ayting.");return}
  const pcm=new Int16Array(n);for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,all[Math.floor(i*ratio)]));pcm[i]=s<0?s*0x8000:s*0x7fff}
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf),w=(p,s)=>[...s].forEach((ch,i)=>dv.setUint8(p+i,ch.charCodeAt(0)));
  w(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,16000,true);dv.setUint32(28,32000,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,pcm.length*2,true);

     <div style="font-size:13.5px;margin-bottom:8px">${poolStatus(p,esc(it.unit_short))}</div>
     <div class="mem">${p.members.map(x=>`<span class="${x.you?"me":""}">${esc(x.name)} · ${qn(x.qty)}</span>`).join("")}</div>
     ${!p.joined&&p.status!=="full"?`<button class="btn teal" style="margin-top:10px;padding:8px 14px" data-pjoin="${esc(it.family_key)}" data-q="${it.qty}" data-r="${esc(it.region_id||"")}">Guruhga qo'shilish (${qn(it.qty)} ${esc(it.unit_short)})</button>`:""}
     <p class="note" style="margin-top:6px">Hammasi bitta narxda: ${sh(p.unit_price)} so'm/${esc(it.unit_short)}. ${esc(p.refund)}<span class="biz"> ${esc(p.note)}</span></p></div>`:""}
   ${rej.length?`<details><summary>Qo'riqchi ${rej.length} ta lotni to'xtatdi — nega?</summary>${rej.map(x=>`<div class="rej"><b>${esc(x.lot.seller_name)}</b>: ${esc(x.guard.summary.replace("Rad etildi: ",""))}${x.lot.is_test?`<div class="inj">Lot matni: “${esc(x.lot.spec)}”</div>`:""}<ul class="checks">${x.guard.checks.map(c=>`<li class="${c.status}"><span class="x">${c.status==="ok"?"✓":c.status==="fail"?"✕":"!"}</span><span>${esc(c.title)}: ${esc(c.detail)}<span class="biz ref"> · ${esc(/^\d+$/.test(c.ref.clause)?c.ref.clause+"-band":c.ref.uz)}</span></span></li>`).join("")}</ul></div>`).join("")}</details>`:""}
   ${m.n_accept>1?`<details class="biz"><summary>Boshqa mos lotlar (${m.n_accept-1})</summary><ul class="list">${m.results.filter(x=>x.guard.verdict==="accept"&&x!==best).map(x=>`<li><span style="flex:1">${esc(x.lot.seller_name)} <span class="muted">${esc(x.lot.region_uz)}</span></span><span class="mono">${sh(x.lot.expected_price)}</span><span class="muted">${x.lot.delivery_term_days} kun</span></li>`).join("")}</ul></details>`:""}
  </div>`}

/* checkout ---------------------------------------------------------------- */
function checkout(v){
  const R=S.run?.items||[];if(!R.length){location.hash="#/agent";return}
  const rows=S.cart.map((it,i)=>({it,R:R[i]})).filter(x=>x.R?.d);
  const sum=k=>rows.reduce((a,x)=>a+x.R.d[k],0);const dep=rows.reduce((a,x)=>a+x.R.d.deposit_amount,0);const ev=S.ev?.deposit_effect;
  v.innerHTML=`<div class="crumbs"><a href="#/agent">Agent</a> / Rasmiylashtirish</div><div class="sec-h" style="margin-top:0"><h2>Rasmiylashtirish</h2></div>
  <div class="cartg"><div>
   <div class="card"><h3>Nimani imzolaysiz</h3><table class="cost" style="margin-top:6px">${rows.map(x=>`<tr><td><b>${esc(x.it.family_uz)}</b> · ${qn(x.it.qty)} ${esc(x.it.unit_short)}<small>${esc(x.R.d.lot.seller_name)} · ${sh(x.R.d.unit_price)} / ${esc(x.it.unit_short)} · ${dt(x.it.deadline)} gacha${x.R.d.pool.needed?" · birga olish":""}</small></td><td>${money(x.R.d.amount)}</td></tr>`).join("")}</table></div>
   <div class="card" style="margin-top:14px"><h3>Halollik pul tejaydi</h3>
    <p class="ink2" style="margin-top:6px">Siz yangi ishtirokchisiz, shuning uchun ${T("zakalat","zakalat")} standart: <b>10%</b>. Bitimlarni o'z vaqtida bajarsangiz, ishonch ballingiz oshadi va keyingi safar zakalat <b>7%</b> gacha tushadi. Asos: UZEX qoidalari, 94 va 299-bandlar.</p>
    ${ev?`<p class="why">Nega bu ishlaydi: datasetda zakalat ${ev.by_deposit.map(x=>x.deposit_pct+"% bo'lgan bitimlarda bekor qilish "+pct(x.annul_pct)).join(", ")}. Zakalat — intizom dastagi.</p>`:""}</div>
   <div class="card" style="margin-top:14px"><h3>Keyin nima bo'ladi</h3><ul class="list" style="margin-top:4px">${(rows[0]?.R.d.schedule||[]).map(s=>`<li><b class="mono" style="min-width:96px">${dt(s.date)}</b><span>${esc(s.event)}</span></li>`).join("")}</ul></div>
  </div>
  <aside class="card sum"><h3>To'lov</h3>
   <div class="ln" style="margin-top:8px"><span>Tovarlar</span><b>${money(sum("amount"))}</b></div>
   <div class="ln"><span>Birja yig'imi 0,13%</span><b>${money(sum("fee_exchange"))}</b></div>
   <div class="ln"><span>${T("kliring","Kliring")} 0,05%</span><b>${money(sum("fee_clearing"))}</b></div>
   <div class="ln tot"><span>Jami</span><b>${money(sum("total"))}</b></div>
   <div class="ln"><span class="muted">Hozir bloklanadi (zakalat, qaytadi)</span><b>${money(dep)}</b></div>
   <label class="row" style="gap:8px;margin-top:12px;font-size:14px;flex-wrap:nowrap"><input type="checkbox" id="agree"> Shartlarni o'qidim, tasdiqlayman</label>
   <div id="signBox" style="margin-top:10px"><button class="btn block lg" id="sign" disabled>${ico("i-pen")}ERI bilan imzolash</button></div>
   <p class="note" style="margin-top:8px">Pilot bosqichida ${T("broker","broker")} ham tasdiqlaydi. Qonunchilik o'zgarishi shart emas.</p></aside></div>`;
  $("#agree").onchange=e=>$("#sign").disabled=!e.target.checked;
  $("#sign").onclick=async()=>{$("#signBox").innerHTML=`<div class="okm">${ico("i-check")}ERI imzosi qo'yildi</div><div class="note">Broker tasdig'i kutilmoqda…</div>`;
    for(const x of rows)await api("/api/talab/deal",{item:x.it,contract_no:x.R.d.lot.contract_no,session_id:S.session});refreshAudit();await wait(900);
    const id="B-"+String(Date.now()).slice(-6);S.orders.unshift({id,created:S.cat.today,lines:rows.map(x=>({family_uz:x.it.family_uz,family_key:x.it.family_key,qty:x.it.qty,unit_short:x.it.unit_short,seller:x.R.d.lot.seller_name,amount:x.R.d.amount,schedule:x.R.d.schedule,pool:x.R.d.pool.needed})),total:sum("total")});
    saveOrders();S.cart=[];saveCart();S.run=null;location.hash="#/buyurtmalar"};
}

/* orders + dispute -------------------------------------------------------- */
function orders(v){
  if(!S.orders.length){v.innerHTML=`<div class="card empty">${ico("i-box")}<h2 style="margin:12px 0 6px">Buyurtmalar yo'q</h2><p>Imzolangan talabnomalar shu yerda kuzatiladi.</p><a class="btn ghost" href="#/nizo" style="margin-top:10px">${ico("i-scale")}Nizo namunasini ko'rish</a></div>`;return}
  v.innerHTML=`<div class="sec-h" style="margin-top:0"><h2>Buyurtmalarim</h2></div>`+S.orders.map(o=>`<div class="order"><div class="row"><b style="font-size:16px">Buyurtma ${esc(o.id)}</b><span class="stamp human">${ico("i-pen")}Imzolangan · broker tasdiqlagan</span><span class="sp"></span><b class="mono">${money(o.total)}</b></div>
   ${o.lines.map(l=>{const s=l.schedule;return`<div style="margin-top:14px"><div class="row"><span class="ic sq" style="width:36px;height:36px;background:#e9ecf1 url(${IMG(l.family_key)}) center/cover"></span><b>${esc(l.family_uz)} · ${qn(l.qty)} ${esc(l.unit_short)}</b><span class="muted">${esc(l.seller)}${l.pool?" · birga olish":""}</span></div>
    <div class="track"><div class="done">Talabnoma<b>${dt(o.created)}</b></div><div class="done">Bitim<b>${dt(s[0].date)}</b></div><div>To'lov<b>${dt(s[1].date)}</b></div><div>Yetkazish<b>${dt(s[2].date)}</b></div></div></div>`}).join("")}
   <div class="row" style="margin-top:10px"><span class="note">Muddatlarni tizim kuzatadi. Kechikish bo'lsa, xabar olasiz.</span><span class="sp"></span><a class="btn ghost" href="#/nizo">${ico("i-scale")}Muammo bormi? Nizo ochish</a></div></div>`).join("");
}
async function dispute(v){
  v.innerHTML=`<div class="loading"><span class="dots"><i></i><i></i><i></i></span><br>AI-hakam dalillarni o'qimoqda…</div>`;
  if(!S.arb){S.arb=await api("/api/talab/arbiter_ai?session_id="+S.session);refreshAudit()}
  const a=S.arb;
  v.innerHTML=`<div class="crumbs"><a href="#/buyurtmalar">Buyurtmalar</a> / Nizo</div>
  <div class="cartg"><div>
   <div class="card"><div class="row"><h2 style="font-size:20px">Yetkazish kechikdi: real holat</h2><span class="sp"></span><span class="stamp ai">Qaror loyihasi · imzolanmagan</span></div>
    <p class="ink2" style="margin-top:6px"><span class="odd">Tizim dalillarni o'zi yig'di. AI qoidaga asoslangan loyiha yozdi. Yakuniy qarorni har doim inson qabul qiladi.</span><span class="biz">Datasetdagi real kechikkan bitim. Faktlar bazadan, qoida matni UZEX qoidalaridan.</span></p>
    <table class="facts" style="margin-top:8px">${a.facts.map(f=>`<tr><td>${esc(f.k)}</td><td>${esc(f.v)}</td></tr>`).join("")}</table>
    <div class="row" style="margin-top:14px"><span class="stamp ai">${a.ai.source==="ai"?"Yordamchi tayyorlagan loyiha":"Standart loyiha"}</span>${a.ai.reason?`<span class="note">${esc(a.ai.reason)}</span>`:""}</div>
    <div class="draft">${esc(md(a.ai.text))}</div>
    ${a.options.map(o=>`<div class="opt"><b>Variant ${esc(o.id)}.</b> ${esc(o.text)}${o.note?`<div class="why">${esc(o.note)}</div>`:""}</div>`).join("")}
    <details style="margin-top:10px"><summary>Qoidalar matni (${a.rules.map(r=>r.clause).join(", ")}-bandlar)</summary>${a.rules.map(r=>`<div class="quote"><b>${r.clause}-band.</b> ${esc(r.uz)}<div class="pro" style="margin-top:4px">${esc(r.ru)}</div></div>`).join("")}</details>
   </div></div>
   <aside class="card sum who"><h3>Kim nima qiladi</h3>
    <div class="tg"><i class="a">${ico("i-pen")}</i><span><b>Yordamchi</b> loyiha yozdi</span></div>
    <div class="tg"><i class="c">${ico("i-shield")}</i><span><b>Kod</b> faktlarni bazadan oldi, raqamlarni tekshirdi</span></div>
    <div class="tg"><i class="h">${ico("i-pen")}</i><span><b>Inson</b> imzolaydi</span></div>
    <p style="font-size:14px;margin-top:10px"><b>Tomonlardan kerak:</b> ${a.need_from_parties.map(esc).join("; ")}</p>
    <div id="hBox"><button class="btn block" id="hBtn">${ico("i-pen")}Komissiya a'zosi sifatida ko'rib chiqish</button></div>
    <p class="note" style="margin-top:8px">${esc(a.human)}</p><p class="note pro">bitim №${a.deal_no}</p></aside></div>`;
  $("#hBtn").onclick=()=>$("#hBox").innerHTML=`<div class="okm">${ico("i-check")}Ko'rib chiqishga olindi</div><div class="note">Qaror faqat inson imzosi bilan kuchga kiradi.</div>`;
}

/* evidence ---------------------------------------------------------------- */
async function openEv(){
  $("#evov").classList.add("on");$("#evsheet").innerHTML=`<div class="bd loading">Yuklanmoqda…</div>`;
  if(!S.ev)S.ev=await api("/api/talab/evidence");
  const e=S.ev,b=e.baseline,de=e.deposit_effect,bs=e.band_savings,sb=e.signal_backtest.by_family,ps=e.parser||{};
  const fam={cement:"Sement",rebar:"Armatura",brick:"G'isht",flour:"Un",sugar:"Shakar",diesel:"Dizel",petrol:"Benzin",polyethylene:"Polietilen"};
  $("#evsheet").innerHTML=`<div class="top">${ico("i-chart")}<h2>Isbot: real data ustida</h2><span class="sp"></span><button class="x" onclick="$('#evov').classList.remove('on')">${ico("i-x")}</button></div><div class="bd">
   <p class="note">${esc(e.dataset)} · hisoblangan ${esc(e.generated_at)} · faqat SQL · tests/talab_evidence.py</p>
   <div class="evh">1. Muammo</div><div class="kpis"><div class="kpi"><b>${fmtN(b.annul_trln,1)} trln</b><span>so'mlik bekor bitim (${pct(b.annul_pct,2)})</span></div><div class="kpi"><b>${pct(b.spread_median_pct)}</b><span>bir tovar, bir haftadagi narx farqi</span></div><div class="kpi"><b>${pct(b.at_start_price_pct)}</b><span>bitim boshlang'ich narxda — raqobatsiz</span></div><div class="kpi"><b>${pct(b.cement_lt10t_pct)}</b><span>sement bitimlari 10 t dan kichik</span></div></div>
   <div class="evh">2. Adolatli narx</div><p>2025–26-yillarda bitimlarning <b>${pct(bs.above_pct)}</b> i o'sha paytdagi oraliqdan qimmatga yopilgan; ortiqcha to'lov <b>${fmtN(bs.overpay_mlrd)} mlrd so'm</b> (aylanma ${fmtN(bs.total_trln,1)} trln).</p><p class="note">${esc(bs.caveat)}</p>
   <div class="evh">3. Zakalat — intizom dastagi</div><table class="ev"><tr><th>Zakalat</th><th>Bitimlar</th><th>Bekor qilish</th></tr>${de.by_deposit.map(x=>`<tr><td>${x.deposit_pct}%</td><td class="n">${fmtN(x.n)}</td><td class="n">${pct(x.annul_pct,2)}</td></tr>`).join("")}</table>
   <div class="honest"><b>Halol cheklov.</b> ${esc(e.history_predicts.conclusion)}</div>
   <div class="evh">4. "Qachon olish" signali, orqaga qarab sinov</div><table class="ev"><tr><th>Tovar</th><th>"Kuting"</th><th>To'g'ri</th><th>Tejam</th><th>Holati</th></tr>${Object.entries(sb).map(([k,x])=>{const on=x.wait_hit_pct>=55&&x.avg_saving_when_wait_pct>0;return`<tr><td>${fam[k]||k}</td><td class="n">${x.wait_signals}</td><td class="n">${x.wait_right} (${pct(x.wait_hit_pct,0)})</td><td class="n">${pct(x.avg_saving_when_wait_pct)}</td><td>${on?`<span class="stamp code">yoqilgan</span>`:`<span class="stamp no">o'chirilgan</span>`}</td></tr>`}).join("")}</table>
   ${ps.dev?`<div class="evh">5. Talabnoma aniqligi (dastur tahlilchisi)</div><table class="ev"><tr><th>To'plam</th><th>To'liq to'g'ri</th><th>Tovar</th><th>Hajm</th><th>Hudud</th><th>Muddat</th><th>Narx</th></tr>${["dev","holdout"].filter(k=>ps[k]).map(k=>{const x=ps[k];return`<tr><td>${k==="dev"?"dev":"holdout (bir marta)"}</td><td class="n">${x.exact}/${x.n}</td>${["family","qty","region","deadline","price"].map(f=>`<td class="n">${x.fields_pct[f]}%</td>`).join("")}</tr>`}).join("")}</table><p class="note">AI javobi shu tahlilchi bilan solishtiriladi: kelishmovchilikda matndagi qiymat olinadi.</p>`:""}
  </div>`;
}
$("#evBtn").onclick=openEv;$("#evov").addEventListener("click",e=>{if(e.target.id==="evov")$("#evov").classList.remove("on")});

/* boot -------------------------------------------------------------------- */
(async()=>{setMode(S.mode);saveCart();saveOrders();
  try{[S.meta,S.cat]=await Promise.all([api("/api/talab/meta"),api("/api/talab/catalog")]);S.pools=(await api("/api/talab/pools2?session_id="+S.session)).pools;api("/api/talab/evidence").then(e=>S.ev=e).catch(()=>{})}
  catch(e){$("#view").innerHTML=`<div class="card err">Server bilan aloqa yo'q: ${esc(e.message)}</div>`;return}
  aiChip();renderTicker();route();refreshAudit()})();
</script>
